name: Manual Build

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to build (e.g., v1.35.0)'
        required: true
        type: string
      publish:
        description: 'Publish to Maven Central'
        required: false
        type: boolean
        default: false
      skip_tests:
        description: 'Skip tests (compile only). Use for publishing when flaky upstream tests block.'
        required: false
        type: boolean
        default: false
      version_override:
        description: 'Override computed version (e.g., 1.35.0-pkware.1). Leave empty for auto.'
        required: false
        type: string
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply patches
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: ./scripts/apply-patches.sh "$UPSTREAM_TAG"

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build and test
        working-directory: build
        run: ./gradlew ${{ inputs.skip_tests && 'assemble' || 'build' }}

      - name: Compute version
        if: inputs.publish
        id: version
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          BASE="${UPSTREAM_TAG#v}"
          CURRENT=$(cat .upstream-version)
          if [ "$UPSTREAM_TAG" != "$CURRENT" ]; then
            N=1
          else
            COUNT=$(git rev-list --count $(git log -1 --format=%H -- .upstream-version)..HEAD)
            N=$((COUNT + 1))
          fi
          VERSION="${BASE}-pkware.${N}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to Maven Central
        if: inputs.publish
        working-directory: build
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository \
            -PoverrideVersion="$PUBLISH_VERSION"

      - name: Create GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          gh release create "v${VERSION}" \
            --title "Temporal SDK ${UPSTREAM_TAG} (PKWARE variant)" \
            --notes "Based on upstream [${UPSTREAM_TAG}](https://github.com/temporalio/sdk-java/releases/tag/${UPSTREAM_TAG}).

          **Active patches:**
          $(ls -1 patches/*.patch | sed 's|patches/||' | sed 's/^/- /')"
